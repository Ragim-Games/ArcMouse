name: Windows EXE
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate source and version
        shell: pwsh
        run: |
          python -m compileall -q arcmouse main.py scripts firmware/pico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = python -c "from arcmouse import __version__; print('v' + __version__)"
            if ($version -ne $env:GITHUB_REF_NAME) { throw 'Tag and app version do not match' }
          }
      - name: Build EXE and ZIP
        run: python scripts/build_windows.py
      - name: Test packaged app without mouse input
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'arcmouse-self-test.json'
          $app = Start-Process -FilePath (Resolve-Path 'dist/ArcMouse.exe') -ArgumentList @('--self-test', "`"$report`"") -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) {
            taskkill /PID $app.Id /T /F
            throw 'Packaged self-test timed out'
          }
          if (-not (Test-Path -LiteralPath $report)) { throw 'Self-test report was not created' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          Get-Content -LiteralPath $report
          if (-not $result.ok -or -not $result.frozen) { throw 'Packaged self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ArcMouse-windows-x64
          path: dist/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ArcMouse-windows-x64
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "ArcMouse $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
